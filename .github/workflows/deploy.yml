name: Deploy Bicep Infrastructure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Directly execute Azure CLI deployment (More reliable & detailed error logs)
      - name: Deploy Bicep Template
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az deployment group create \
              --resource-group ${{ secrets.AZURE_RG }} \
              --template-file ./main.bicep \
              --parameters storagePrefix=avi